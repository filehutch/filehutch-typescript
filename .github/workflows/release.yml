name: Release

# Cut releases with `bin/release <version>`, which tags and pushes; the tag is
# what runs this.
#
# Publishing uses npm trusted publishing (OIDC), so there is no token in this
# repository to leak or rotate. npm will not attach a trusted publisher to a
# package that does not exist, so 0.1.0 was published by hand; configure it at
# https://www.npmjs.com/package/@filehutch/sdk/access against this repository,
# this workflow filename, and the `npm` environment below.
on:
  push:
    tags: [ "v*" ]

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm

    permissions:
      contents: read
      # Lets npm attach a provenance attestation, so anyone can verify the
      # published tarball was built from this commit by this workflow.
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Trusted publishing needs npm 11.5.1 or newer. Node 24 bundles it; on
      # Node 22, `npm install -g npm@latest` breaks partway through replacing
      # itself (MODULE_NOT_FOUND: promise-retry), which failed v0.1.1.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Check npm can publish with trusted publishing
        run: |
          npm --version
          node -e 'const [a,b]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&b>=5)?0:1)' "$(npm --version)"

      - name: Install dependencies
        run: npm ci

      # A tag that disagrees with package.json would publish a version nobody
      # can find from the source, so stop before anything is built.
      - name: Check the tag matches package.json
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(node -p "require('./package.json').version")"
          if [ "$tagged" != "$declared" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${declared}" >&2
            exit 1
          fi

      - name: Run tests
        run: npm test

      # The first release is published from a laptop, because npm will not
      # attach a trusted publisher to a package that does not exist and a
      # runner cannot answer a 2FA prompt. Its tag still lands here, so skip
      # rather than fail on a version that is already out.
      - name: Publish to npm
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "$(node -p "require('./package.json').name")@${version}" version >/dev/null 2>&1; then
            echo "${version} is already on npm; nothing to publish."
            exit 0
          fi
          npm publish --provenance --access public
