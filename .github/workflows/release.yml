name: Release

# Tag the version you are releasing, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
# Needs an NPM_TOKEN secret with publish rights on the @filehutch scope.
on:
  push:
    tags: [ "v*" ]

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm

    permissions:
      contents: read
      # Lets npm attach a provenance attestation, so anyone can verify the
      # published tarball was built from this commit by this workflow.
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A tag that disagrees with package.json would publish a version nobody
      # can find from the source, so stop before anything is built.
      - name: Check the tag matches package.json
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(node -p "require('./package.json').version")"
          if [ "$tagged" != "$declared" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${declared}" >&2
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
